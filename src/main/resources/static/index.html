<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 950px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        .form-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
        }
        .form-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-add {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #343a40;
            color: white;
        }
        .btn-borrow {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
        }
        .btn-return {
            background-color: #ffc107;
            color: #212529;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:disabled {
            background-color: #ccc !important;
            cursor: not-allowed;
            color: #666;
        }
        .message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 4px;
            display: none;
            text-align: center;
            font-weight: bold;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Library Management System</h1>
    <div id="alertBox" class="message"></div>

    <!-- Add Book Form -->
    <div class="form-box">
        <input type="text" id="newTitle" placeholder="Book Title" required>
        <input type="text" id="newAuthor" placeholder="Author" required>
        <input type="number" id="newCopies" placeholder="Copies" min="1" style="max-width: 100px;" required>
        <button class="btn-add" onclick="addNewBook()">+ Add Book</button>
    </div>

    <!-- Books Table -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Available Copies</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="booksTableBody">
            <!-- Books load dynamically -->
        </tbody>
    </table>
</div>

<script>
    const API_URL = 'http://localhost:8080/api/books';

    async function loadBooks() {
        try {
            const res = await fetch(API_URL);
            const books = await res.json();
            const tableBody = document.getElementById('booksTableBody');
            tableBody.innerHTML = '';

            books.forEach(book => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${book.id}</td>
                    <td><strong>${book.title}</strong></td>
                    <td>${book.author}</td>
                    <td>${book.availableCopies}</td>
                    <td>
                        <button class="btn-borrow"
                            ${book.availableCopies === 0 ? 'disabled' : ''} 
                            onclick="borrowBook(${book.id})">
                            ${book.availableCopies === 0 ? 'Out of Stock' : 'Borrow'}
                        </button>
                        <button class="btn-return" onclick="returnBook(${book.id})">
                            Return
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        } catch (err) {
            showAlert('Failed to load books!', 'error');
        }
    }

    async function addNewBook() {
        const title = document.getElementById('newTitle').value.trim();
        const author = document.getElementById('newAuthor').value.trim();
        const copies = parseInt(document.getElementById('newCopies').value);

        if (!title || !author || isNaN(copies) || copies <= 0) {
            showAlert('Please fill all fields properly!', 'error');
            return;
        }

        try {
            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, author, availableCopies: copies })
            });

            if (res.ok) {
                showAlert('Book added successfully!', 'success');
                document.getElementById('newTitle').value = '';
                document.getElementById('newAuthor').value = '';
                document.getElementById('newCopies').value = '';
                loadBooks();
            } else {
                showAlert('Failed to add book!', 'error');
            }
        } catch (err) {
            showAlert('Server connection error!', 'error');
        }
    }

    async function borrowBook(id) {
        try {
            const res = await fetch(`${API_URL}/${id}/borrow`, { method: 'POST' });
            if (res.ok) {
                const data = await res.json();
                showAlert(`${data.message}! Due date: ${data.dueDate}`, 'success');
                loadBooks();
            } else {
                const errorMsg = await res.text();
                showAlert(errorMsg, 'error');
            }
        } catch (err) {
            showAlert('Server connection error!', 'error');
        }
    }

    async function returnBook(id) {
        try {
            const res = await fetch(`${API_URL}/${id}/return`, { method: 'POST' });
            if (res.ok) {
                const data = await res.json();
                showAlert(data.message, 'success');
                loadBooks();
            } else {
                showAlert('Failed to return book!', 'error');
            }
        } catch (err) {
            showAlert('Server connection error!', 'error');
        }
    }

    function showAlert(msg, type) {
        const alertBox = document.getElementById('alertBox');
        alertBox.textContent = msg;
        alertBox.className = `message ${type}`;
        alertBox.style.display = 'block';
        setTimeout(() => { alertBox.style.display = 'none'; }, 3500);
    }

    loadBooks();
</script>

</body>
</html>
